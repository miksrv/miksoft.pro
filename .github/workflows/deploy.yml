name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    ssh-deploy:
        name: Production
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'yarn'
                  cache-dependency-path: yarn.lock

            - name: Cache node modules
              uses: actions/cache@v4
              id: cache-npm
              with:
                  path: |
                      node_modules
                      ~/.npm
                      ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-modules-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-modules-
                      ${{ runner.os }}-

            - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
              name: Install dependencies
              run: yarn workspaces focus

            - name: Cache UI build
              uses: actions/cache@v4
              id: cache-build
              with:
                  path: |
                      .next
                      out
                  key: ${{ runner.os }}-build-${{ hashFiles('**/*.ts', '**/*.tsx', 'public/**') }}
                  restore-keys: |
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
              name: Build UI
              run: yarn build

            - name: Install LFTP
              run: sudo apt install lftp

            - name: Configure LFTP
              run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc

            - name: Load Secrets
              run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc

            - name: Upload Folder
              run: |
                  lftp -c "
                    open ${{ secrets.FTP_HOSTNAME }};
                    mirror --parallel=100 -R --delete out/ /
                  "
